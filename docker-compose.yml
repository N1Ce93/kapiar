services:
  marketing-caddy:
    image: "caddy:2-alpine"
    container_name: "marketing-caddy"
    restart: unless-stopped
    depends_on:
      - marketing-php
    environment:
      CADDY_SERVER_NAME: "${CADDY_SERVER_NAME:-:80}"
      TZ: "${TZ:-Europe/Kyiv}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - "./src:/app:ro"
      - "./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    networks:
      - marketing

  marketing-php:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: "marketing-php"
    working_dir: "/app"
    environment:
      - "DB_HOST=marketing-db"
      - "TZ=${TZ:-Europe/Kyiv}"
    volumes:
      - "./src:/app"
      - "./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
    networks:
      - marketing

  marketing-db:
    restart: unless-stopped
    image: "mysql:8.4"
    container_name: "marketing-db"
    command: "--event-scheduler=ON"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-marketing}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: "${TZ:-Europe/Kyiv}"
    volumes:
      - "./.mysql:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - marketing

  marketing-cache:
    restart: unless-stopped
    image: "valkey/valkey:8-alpine"
    container_name: "marketing-cache"
    command: "valkey-server --appendonly yes --loglevel warning"
    environment:
      TZ: "${TZ:-Europe/Kyiv}"
    volumes:
      - "./.redis:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - marketing

  marketing-sources-queue:
    environment:
      - "DB_HOST=marketing-db"
      - "REDIS_HOST=marketing-cache"
      - "TZ=${TZ:-Europe/Kyiv}"
    restart: unless-stopped
    stop_grace_period: 12m
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: "marketing-sources-queue"
    depends_on:
      marketing-db:
        condition: service_healthy
      marketing-cache:
        condition: service_healthy
    volumes:
      - "./src:/app"
      - "./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
    working_dir: "/app"
    command: "php artisan queue:work --queue=sources --timeout=660 --tries=1 --max-time=3600 --max-jobs=500"
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:sources", "--max=200"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - marketing

  marketing-telegram-queue:
    environment:
      - "DB_HOST=marketing-db"
      - "REDIS_HOST=marketing-cache"
      - "TZ=${TZ:-Europe/Kyiv}"
    restart: unless-stopped
    stop_grace_period: 6m
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: "marketing-telegram-queue"
    depends_on:
      marketing-db:
        condition: service_healthy
      marketing-cache:
        condition: service_healthy
    volumes:
      - "./src:/app"
      - "./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
    working_dir: "/app"
    command: "php artisan queue:work --queue=telegram --timeout=360 --tries=1 --max-time=3600 --max-jobs=300"
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:telegram", "--max=200"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - marketing

  marketing-email-queue:
    environment:
      - "DB_HOST=marketing-db"
      - "REDIS_HOST=marketing-cache"
      - "TZ=${TZ:-Europe/Kyiv}"
    restart: unless-stopped
    stop_grace_period: 17m
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: "marketing-email-queue"
    depends_on:
      marketing-db:
        condition: service_healthy
      marketing-cache:
        condition: service_healthy
    volumes:
      - "./src:/app"
      - "./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
    working_dir: "/app"
    command: "php artisan queue:work --queue=email --timeout=960 --tries=3 --backoff=60 --max-time=3600 --max-jobs=500"
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:email", "--max=200"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - marketing

  marketing-scheduler:
    environment:
      - "DB_HOST=marketing-db"
      - "REDIS_HOST=marketing-cache"
      - "TZ=${TZ:-Europe/Kyiv}"
    restart: unless-stopped
    stop_grace_period: 1m
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: "marketing-scheduler"
    depends_on:
      marketing-db:
        condition: service_healthy
      marketing-cache:
        condition: service_healthy
    volumes:
      - "./src:/app"
      - "./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
    working_dir: "/app"
    command: "php artisan schedule:work"
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - marketing

volumes:
  caddy_data:
  caddy_config:

networks:
  marketing:
    name: "marketing"
